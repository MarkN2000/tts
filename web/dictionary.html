<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー辞書</title>
  <link rel="stylesheet" href="/dictionary.css">
  <script src="/dictionary.js" defer></script>
</head>
<body class="admin-page">
  <main class="admin-card">
    <p class="eyebrow">TTS SERVER</p>
    <h1>ユーザー辞書</h1>
    <p class="lead">VOICEVOX / AivisSpeech 共通の単語を編集します。</p>

    <div class="admin-actions">
      <button id="reload-button" class="secondary-button" type="button">辞書を再読み込み</button>
      <button id="add-button" type="button">単語を追加</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">読み込み中です…</p>
    <p id="error" class="status error" role="alert"></p>
    <p id="excluded-note" class="admin-help excluded-note" hidden>
      AivisSpeech固有の複合語・品詞は、この画面の編集対象に含まれません。
    </p>

    <section id="update-panel" class="update-panel" aria-labelledby="update-title" hidden>
      <div class="list-heading">
        <h2 id="update-title">サーバー更新</h2>
        <span id="current-version" class="word-count"></span>
      </div>
      <p class="field-note">GitHubの最新リリースを確認し、実行ファイルを更新して再起動します。</p>
      <div class="admin-actions update-actions">
        <button id="check-update-button" class="secondary-button" type="button">アップデートを確認</button>
        <button id="apply-update-button" type="button" hidden>更新して再起動</button>
      </div>
      <p id="update-status" class="status" role="status" aria-live="polite"></p>
      <p id="update-error" class="status error" role="alert"></p>
    </section>

    <form id="word-form" class="word-form" novalidate hidden>
      <h2 id="editor-title">単語を追加</h2>
      <input id="word-uuid" type="hidden">

      <label for="surface">単語</label>
      <input id="surface" name="surface" type="text" required autocomplete="off">

      <label for="pronunciation">読み（カタカナ）</label>
      <input id="pronunciation" name="pronunciation" type="text" required pattern="[ァ-ヴー]+" autocomplete="off" aria-describedby="pronunciation-note">
      <p id="pronunciation-note" class="field-note">ひらがなは入力確定後にカタカナへ変換されます。</p>

      <fieldset class="accent-field">
        <legend>アクセント</legend>
        <input id="accent-type" name="accent_type" type="hidden" value="0">
        <p id="accent-empty" class="accent-empty">読みを入力すると選択できます。</p>
        <div id="accent-picker" hidden>
          <div class="accent-viewport">
            <div id="accent-track" class="accent-track">
              <input id="accent-slider" class="accent-slider" type="range" min="1" max="2" step="1" value="2" aria-label="アクセント位置">
              <div id="accent-diagram"></div>
              <div id="accent-labels" class="accent-labels"></div>
            </div>
          </div>
        </div>
      </fieldset>

      <label for="word-type">品詞</label>
      <select id="word-type" name="word_type">
        <option value="PROPER_NOUN">固有名詞</option>
        <option value="COMMON_NOUN">普通名詞</option>
        <option value="VERB">動詞</option>
        <option value="ADJECTIVE">形容詞</option>
        <option value="SUFFIX">接尾辞</option>
      </select>

      <label for="priority">優先度</label>
      <div class="priority-control">
        <input id="priority" name="priority" type="range" min="0" max="10" step="1" value="5">
        <output id="priority-value" for="priority">5</output>
      </div>

      <p class="field-note">試し読みでは辞書を変更せず、入力中の読みとアクセントだけを確認します。</p>
      <div class="form-actions">
        <button id="cancel-button" class="secondary-button" type="button">キャンセル</button>
        <button id="preview-button" class="secondary-button" type="button">この読みで試聴</button>
        <button id="save-button" type="submit">辞書に追加</button>
      </div>
    </form>

    <section class="dictionary" aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">登録単語</h2>
        <span id="word-count" class="word-count"></span>
      </div>
      <p id="empty-message" class="empty-message" hidden>編集できる単語は登録されていません。</p>
      <div id="word-list" class="word-list" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
