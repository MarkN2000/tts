<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音声生成</title>
  <link rel="stylesheet" href="/webui.css">
  <script src="/webui.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-label="音声生成">
      <form id="tts-form">
        <div class="form-fields">
          <label for="speaker-select">話者・スタイル</label>
          <select id="speaker-select" name="id" disabled>
            <option value="">既定の話者・スタイル</option>
          </select>

          <label for="text-input">テキスト</label>
          <textarea id="text-input" name="text" rows="1" required disabled placeholder="読み上げるテキストを入力してください"></textarea>
        </div>
        <div class="form-actions">
          <p id="status" class="status" role="status" aria-live="polite">話者一覧を読み込んでいます…</p>
          <button id="generate-button" class="primary" type="submit" disabled>音声を生成</button>
        </div>
      </form>
    </section>

    <section id="result" class="panel result" aria-labelledby="result-title" hidden>
      <h2 id="result-title">生成した音声</h2>
      <p id="license" class="license"></p>
      <audio id="audio-player" controls preload="metadata"></audio>
      <p class="download-row"><a id="download-link" class="secondary-link" download>OGG ファイルをダウンロード</a></p>
    </section>
  </main>
</body>
</html>
