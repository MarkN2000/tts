listen = "127.0.0.1:8080"
admin_listen = "127.0.0.1:8081"
public_base_url = "https://tts.example.com"
api_revision = "v3"

cache_dir = "./cache"
cache_days = 31
cache_max_mb = 1024
cache_revision = 1

ffmpeg_path = "ffmpeg"
codec = "vorbis"
bitrate_kbps = 48

[[engines]]
id = "aivisspeech"
name = "AivisSpeech"
engine_url = "http://127.0.0.1:10101"
default_id = "1878365376"
attribution = { type = "license_from_policy" }

