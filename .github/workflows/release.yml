name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: |
          cargo test --locked
          node --test tests/dictionary-ui.test.cjs
          node --check web/dictionary.js
          node --check web/webui.js

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/tts-server.exe dist/tts-server.exe
          Copy-Item config.toml dist/config.toml
          Compress-Archive -Path dist/tts-server.exe, dist/config.toml -DestinationPath "tts-server-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: tts-server-windows-x86_64.zip

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: |
          cargo test --locked
          node --test tests/dictionary-ui.test.cjs
          node --check web/dictionary.js
          node --check web/webui.js

      - name: Install musl target
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/tts-server dist/tts-server
          cp config.toml dist/config.toml
          tar -czf "tts-server-linux-x86_64.tar.gz" -C dist tts-server config.toml
          cp target/x86_64-unknown-linux-musl/release/tts-server tts-server-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            tts-server-linux-x86_64.tar.gz
            tts-server-linux-x86_64

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
